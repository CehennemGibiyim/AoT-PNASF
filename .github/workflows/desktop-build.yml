name: Desktop Installers (Windows)

# Windows kurulum paketleri bu depoda Linux üzerinde üretilemez:
#  - Electron NSIS/portable için wine + electron-builder gerekir,
#  - Tauri MSI/NSIS için Rust + Windows WebView2 araç zinciri gerekir.
# Bu iş akışı ikisini de windows-latest üzerinde derleyip tek bir kurulum
# klasöründe toplar; v* etiketiyle tetiklenirse GitHub Release de oluşturur.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  electron:
    name: Electron (NSIS + portable)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Web sürümünü derle
        run: |
          npm ci
          npm run build

      - name: Electron bağımlılıkları
        working-directory: desktop/electron
        run: npm ci

      - name: Windows paketlerini üret
        working-directory: desktop/electron
        # Kod imzalama: CSC_LINK (base64 pfx) + CSC_KEY_PASSWORD tanımlıysa
        # electron-builder otomatik imzalar; boşsa imzasız üretir.
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run pack:win

      - uses: actions/upload-artifact@v4
        with:
          name: ham-electron
          path: |
            desktop/electron/release/*.exe
          if-no-files-found: error
          retention-days: 7

  tauri:
    name: Tauri (NSIS + MSI)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      - name: Web sürümünü derle
        run: |
          npm ci
          npm run build

      - name: Tauri CLI
        working-directory: desktop/tauri
        run: npm ci

      - name: İmza yapılandırması (sertifika varsa)
        if: env.WINDOWS_CERT_THUMBPRINT != ''
        working-directory: desktop/tauri
        run: |
          node -e "require('fs').writeFileSync('sign.conf.json', JSON.stringify({bundle:{windows:{certificateThumbprint:process.env.WINDOWS_CERT_THUMBPRINT,digestAlgorithm:'sha256',timestampUrl:'http://timestamp.digicert.com'}}}))"

      - name: Windows paketlerini üret (imzalı)
        if: env.WINDOWS_CERT_THUMBPRINT != ''
        working-directory: desktop/tauri
        run: npm run build:win -- --config sign.conf.json

      - name: Windows paketlerini üret (imzasız)
        if: env.WINDOWS_CERT_THUMBPRINT == ''
        working-directory: desktop/tauri
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: ham-tauri
          path: |
            desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop/tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  # İki kabuğun paketlerini tek klasörde birleştirir: setup/portable/MSI +
  # SHA256SUMS.txt + SURUM.txt + KURULUM-OKU.txt, sonra zip.
  topla:
    name: Kurulum klasörünü topla
    needs: [electron, tauri]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: ham-electron
          path: girdi/electron

      - uses: actions/download-artifact@v4
        with:
          name: ham-tauri
          path: girdi/tauri

      - name: Paketleri kurulum klasöründe topla
        run: node desktop/scripts/collect-windows.mjs --electron girdi/electron --tauri girdi/tauri

      - name: Zip
        working-directory: desktop/windows
        run: |
          SURUM=$(node -p "require('../../package.json').version")
          powershell -NoProfile -Command "Compress-Archive -Path 'kurulum/*' -DestinationPath 'AoT-PNASF-Windows-$SURUM.zip' -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: AoT-PNASF-Windows-Kurulum
          path: |
            desktop/windows/kurulum/**
            desktop/windows/*.zip
          if-no-files-found: error
          retention-days: 30

  # Yalnızca v* etiketinde: paketleri indirilebilir sürüm sayfasına ekler.
  yayinla:
    name: GitHub Release (v* etiketi)
    needs: topla
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AoT-PNASF-Windows-Kurulum
          path: cikti

      - uses: softprops/action-gh-release@v2
        with:
          name: AoT PNASF ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            cikti/**
          fail_on_unmatched_files: true
