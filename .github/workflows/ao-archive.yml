name: Albion savaş arşivi

# gameinfo API'si yalnızca son birkaç günü tutar; tarihsel grafik ve savaş
# raporları için günde bir kez snapshot alıp data/archive/ altına commit eder.
on:
  schedule:
    - cron: '17 5 * * *' # her gün 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ao-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Arşivi üret
        run: node scripts/archive-gameinfo.mjs

      - name: Değişiklikleri commit et
        run: |
          if [ -z "$(git status --porcelain data/archive)" ]; then
            echo "Arşivde değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git commit -m "chore(archive): savaş ve silah meta snapshot'ı [$(date -u +%Y-%m-%d)]"
          git push
