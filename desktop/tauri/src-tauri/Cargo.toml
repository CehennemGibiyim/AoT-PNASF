[package]
name = "aot-pnasf"
version = "1.0.0"
description = "AoT PNASF — Albion Online araçları"
authors = ["CehennemGibiyim"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aot_pnasf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
